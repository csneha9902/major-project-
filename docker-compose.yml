services:
  backend:
    build: ./backend
    container_name: quantum-ai-backend
    ports: ["8000:8000"]
    volumes:
      - ./backend/results:/app/results
      - ./backend/data:/app/data
      - ./mne_data:/root/mne_data
    environment:
      - PYTHONUNBUFFERED=1
      - FRONTEND_URL=http://localhost:5173

  frontend:
    build: ./frontend
    container_name: quantum-ai-frontend
    ports: ["5173:80"]
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
